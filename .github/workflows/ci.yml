name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python unit & integration tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install pinned dependencies from lockfile
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Run unittest suite
        run: PYTHONPATH=src python -m unittest discover tests
      # Policy (R-13): Known vulnerabilities in locked Python dependencies fail CI.
      - name: Audit Python dependencies
        id: python_audit
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.lock

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Policy (R-13): High/critical vulnerabilities in frontend dependencies fail CI.
      - name: Audit frontend dependencies
        id: frontend_audit
        run: npm audit --audit-level=high
      - run: npm run build
