[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pair-programmer"
version = "0.1.0"
description = "A dual-model cross-vendor pair-programming agent harness with XP/TDD workflows"
authors = [{ name = "Aarik Wells" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.13.4",
    "litellm==1.107.0",
    "httpx==0.28.1",
    "rich==15.0.0",
    "python-dotenv==1.2.2",
    "fastapi==0.162.2",
    "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.25.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
